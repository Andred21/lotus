# Substitui docker/nginx/prod.conf VIA BIND MOUNT quando o TLS está ativo
# (docker-compose.prod-tls.yml). Duplica deliberadamente o proxy do
# prod.conf: o mount troca o arquivo inteiro, então este é autossuficiente.
# A igualdade com o prod.conf NÃO é mais promessa de comentário: a catraca
# frontend/tests/nginx-conf.test.ts compara os blocos dos dois arquivos e
# quebra quando divergirem (lição 19; Q-7 do review de 2026-09-20 — o Q-1 do
# mesmo review foi a primeira consequência de não haver catraca aqui).
server {
    listen 80;
    server_name _;

    # Renovação do certbot por webroot — sem derrubar o nginx.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ISENTO do redirect, e de propósito: a sonda de saúde é interna e fala
    # HTTP puro na 127.0.0.1. São duas, e as duas quebravam sob o `location /`
    # abaixo — medido em 2026-09-20 com nginx:alpine (Q-1 do review):
    #   - o healthcheck do nginx (docker-compose.prod.yml, `wget --spider
    #     http://127.0.0.1/up`) SEGUE o 301 para https://127.0.0.1, onde o
    #     certificado é de app.lotusotec.cl e o nome não casa — serviço
    #     unhealthy, e o laço do deploy.sh mata o deploy;
    #   - o gate pós-deploy do deploy.sh (`curl` sem -L, que exige 200)
    #     recebia 301 e abortava DEPOIS do `up -d`: containers novos rodando e
    #     CURRENT_SHA desatualizado.
    # Match exato (`= /up`), que tem prioridade sobre qualquer regex, então
    # esta isenção não alarga: só o health do bootstrap/app.php sai do
    # redirect. O corpo abaixo é o MESMO do proxy — a catraca exige isso.
    location = /up {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 120s;
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_param HTTP_X_FORWARDED_PROTO "";
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_param HTTP_X_FORWARDED_PORT "";
        fastcgi_param HTTP_FORWARDED "";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.lotusotec.cl;

    ssl_certificate     /etc/letsencrypt/live/app.lotusotec.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.lotusotec.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HSTS de um ano (spec do item 32, D3): decidido junto com o TLS e ligado no
    # mesmo deploy. Sem includeSubDomains — a zona tem WordPress, e-mail e o que
    # o site decidir — e sem preload, que não tem volta. `always` para sair
    # também nos 401/419/422/500 do Laravel. REPETIDO nas locations abaixo que
    # têm add_header: um add_header dentro de location cancela os do server. O
    # proxy do fastcgi não tem add_header e herda este. Catraca em
    # frontend/tests/nginx-conf.test.ts; comportamento provado em
    # docs/superpowers/audits/2026-09-27-infra-producao-dns-e-tls.md.
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    location ~ ^/(api|sanctum|up)(/|$) {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 120s;
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_param HTTP_X_FORWARDED_PROTO "";
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_param HTTP_X_FORWARDED_PORT "";
        fastcgi_param HTTP_FORWARDED "";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/ /index.html;
    }
}
