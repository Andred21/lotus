# Runtime de PRODUÇÃO. O compose de dev (docker-compose.yml) continua existindo
# e não é tocado: são arquivos com públicos diferentes.
#
# O que este arquivo tem e o que ele NÃO tem são igualmente deliberados. TEM
# MySQL desde a revisão 2026-09 do ADR-09 (spec v2 do item 10, decisão D2): o
# teto de custo de US$ 30/mês descartou o RDS, e a mitigação é o backup diário
# provado por restore (deploy/bin/backup-db.sh). NÃO tem MinIO (S3 real), nem
# Mailpit (`MAIL_MAILER=log` até o bloco de SES), nem volume de código, nem
# worker de fila. O último foi medido, não suposto: SESSION_DRIVER, CACHE_STORE
# e QUEUE_CONNECTION são `database`, e nenhuma classe implementa ShouldQueue.

# LOG_CHANNEL=stderr (spec D9) tirou o log do disco da aplicação e o entregou ao
# Docker — que, com o driver json-file default, grava em disco do MESMO jeito e
# SEM TETO. Numa EC2 com EBS pequeno isso é o container morrendo por disco cheio
# semanas depois do deploy, longe de qualquer mudança que explique. O teto vale
# até o coletor (CloudWatch) entrar, e continua valendo depois: rotação local é
# barata e o coletor pode cair.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${LOTUS_IMAGE:-lotus-app:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: app
    # Os segredos vivem SÓ no servidor (spec D6). O default aponta para o
    # caminho de produção; a prova local sobrescreve a variável.
    env_file: ${LOTUS_ENV_FILE:-/opt/lotus/.env}
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      gotenberg: {condition: service_started}
      clamav: {condition: service_started}
      mysql: {condition: service_healthy}
    logging: *logging

  # O runner do agendador (spec §4.4). Antes deste bloco NADA agendava nada no
  # projeto: sem `app/Console/`, sem um único `Schedule::`, e sem cron ou
  # supervisor em compose nenhum nem no entrypoint. A poda de retenção existiria
  # como código que nunca executa.
  #
  # Container próprio e não cron do host: o item 10 comprou "o runtime não
  # depende do working tree do servidor" COPIANDO o código para dentro da
  # imagem, e um crontab no host devolveria essa dependência pela porta dos
  # fundos. Mesma imagem, mesmo env_file, mesmo entrypoint — inclusive o gate de
  # variável obrigatória, que aqui vale igual: scheduler que sobe sem DB_HOST
  # falharia toda madrugada em silêncio.
  #
  # `schedule:work` e não `schedule:run` num laço: é o processo de longa duração
  # que o Laravel publica para exatamente este caso, e o `restart` do Compose
  # cobre a queda dele.
  #
  # Sem `ports` e sem healthcheck: não atende ninguém. A contrapartida está
  # declarada como risco na spec §8 — travamento silencioso do processo não é
  # coberto por `restart`, e a ficha de dívida registra isso.
  scheduler:
    image: ${LOTUS_IMAGE:-lotus-app:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: app
    env_file: ${LOTUS_ENV_FILE:-/opt/lotus/.env}
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      app: {condition: service_started}
      mysql: {condition: service_healthy}
    logging: *logging

  # MySQL em container no host único — revisão 2026-09 do ADR-09 (spec v2 do
  # item 10, D2): o teto de custo (US$ 30/mês) descartou o RDS. A mitigação
  # mora em deploy/bin/backup-db.sh (dump diário para o S3, restore provado)
  # e o gatilho de reversão está escrito na própria revisão do ADR.
  # 3306 NÃO é publicada: só a rede interna do Compose alcança o banco.
  # Digest do ÍNDICE multi-arch (amd64 + arm64/v8, medido em 2026-09-02): o host
  # de produção é t4g/Graviton e um digest de arquitetura única não subiria lá.
  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    env_file: ${LOTUS_ENV_FILE:-/opt/lotus/.env}
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 força TCP: a imagem abre o socket Unix ANTES do listener
      # TCP e o healthcheck ficaria verde com o app ainda tomando Connection
      # refused (medido em 2026-08-29, no overlay de sonda). A senha vem do
      # ambiente do container ($$ escapa do interpolador do Compose).
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: ${LOTUS_WEB_IMAGE:-lotus-web:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: web
    ports: ["${LOTUS_HTTP_PORT:-80}:80"]
    restart: unless-stopped
    mem_limit: 128m
    depends_on: [app]
    logging: *logging
    # O healthcheck atravessa o fastcgi até o /up do Laravel, então prova a
    # CADEIA inteira — nginx, socket do FPM e boot da aplicação. É por isso que
    # o serviço `app` não ganha healthcheck próprio: um que respondesse sem
    # passar pelo nginx provaria menos.
    # Não é "localhost": o wget do busybox resolve localhost para ::1 (IPv6),
    # mas docker/nginx/prod.conf só tem `listen 80` (IPv4) — o healthcheck
    # falharia sempre com connection refused. Vale para QUALQUER tag da
    # imagem web (dev usa lotus-web:local; produção aponta LOTUS_WEB_IMAGE
    # para outra), porque a causa é o binário wget, não a tag. Medido.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    mem_limit: 768m
    logging: *logging
    # Medido nesta task: a imagem traz curl (`command -v curl` -> /usr/bin/curl).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    mem_limit: 768m
    logging: *logging
    # Script que a própria imagem traz (medido): faz PING/PONG na 3310.
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mysql-data:
