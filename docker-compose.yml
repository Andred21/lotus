services:
  app:
    build: { context: ., dockerfile: docker/php/Dockerfile, args: { UID: 1000, GID: 1000 } }
    volumes:
      - ./backend:/var/www:cached
      - ./frontend:/frontend:cached
    # A porta host vive no OFFSET da árvore (.env da raiz), e estas cinco
    # chaves carregam a porta DENTRO do valor — o cookie do Sanctum é emitido
    # para o domínio de APP_URL e conferido contra SANCTUM_STATEFUL_DOMAINS, e
    # a URL pública de arquivo aponta para a porta do MinIO. Derivá-las aqui é
    # o que dispensa editar `backend/.env` a cada árvore nova (P-03): variável
    # de ambiente real vence o `.env` do Laravel, que é imutável.
    #
    # AWS_ENDPOINT, DB_HOST/DB_PORT e GOTENBERG_URL ficam de fora de
    # propósito: são rede interna do Compose, não porta publicada.
    environment:
      APP_URL: http://localhost:${LOTUS_DEV_HTTP_PORT:-8080}
      FRONTEND_URL: http://localhost:${LOTUS_DEV_VITE_PORT:-5173}
      SANCTUM_STATEFUL_DOMAINS: localhost:${LOTUS_DEV_VITE_PORT:-5173},localhost:${LOTUS_DEV_HTTP_PORT:-8080}
      AWS_ENDPOINT_PUBLIC: http://localhost:${LOTUS_DEV_MINIO_PORT:-9000}
      AWS_URL: http://localhost:${LOTUS_DEV_MINIO_PORT:-9000}/lotus
      # Cookie de sessão não é isolado por porta (browser vê as duas árvores
      # como o mesmo domínio `localhost`): sem sufixo, logar na árvore B
      # sobrescreve o `laravel-session` da árvore A, e a aba da A passa a
      # mandar um session id que não existe no banco dela — 401 silencioso.
      SESSION_COOKIE: lotus_session_${LOTUS_DEV_HTTP_PORT:-8080}
    depends_on: [mysql, gotenberg, minio, clamav]

  nginx:
    image: nginx:alpine
    ports: ["${LOTUS_DEV_HTTP_PORT:-8080}:80"]
    volumes:
      - ./backend:/var/www:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: lotus
      MYSQL_ROOT_PASSWORD: secret
    ports: ["${LOTUS_DEV_DB_PORT:-3307}:3306"]
    volumes:
      - lotus-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-psecret"]
      interval: 10s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8

  clamav:
    # Tag COM base de assinaturas embutida (146 MiB comprimidos): o `clamd`
    # ficou pronto em ~10 s na medição de 2026-08-25, sem esperar download. A
    # tag `_base` (38 MiB) baixaria a base pelo freshclam no primeiro `up` e
    # deixaria a stack inutilizável por vários minutos.
    #
    # Medido: ~1,01 GiB residentes. É insumo do dimensionamento da EC2 (item 10),
    # não decisão deste bloco.
    image: clamav/clamav:1.4
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mailpit:
    image: axllent/mailpit
    ports: ["${LOTUS_DEV_MAILPIT_PORT:-8025}:8025"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lotus
      MINIO_ROOT_PASSWORD: lotus-secret
    ports: ["${LOTUS_DEV_MINIO_PORT:-9000}:9000", "${LOTUS_DEV_MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes:
      - lotus-minio:/data

  createbuckets:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 lotus lotus-secret) do echo waiting for minio; sleep 2; done;
      /usr/bin/mc mb -p local/lotus;
      exit 0;
      "

volumes:
  lotus-db:
  lotus-minio:
