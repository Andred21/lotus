services:
  app:
    restart: unless-stopped

  nginx:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:8088:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./docker/nginx/preview.conf:/etc/nginx/conf.d/default.conf:ro

  mysql:
    restart: unless-stopped
    ports: !override []

  gotenberg:
    restart: unless-stopped

  minio:
    restart: unless-stopped
    ports: !override []

  createbuckets:
    restart: "no"
