# Overlay de SONDA. Existe só para provar o runtime de produção nesta máquina:
# acrescenta o que produção NÃO tem — MinIO (lá é S3 real) e Mailpit (lá é
# `MAIL_MAILER=log` até o bloco de SES). O MySQL SAIU daqui em 2026-09: pela
# revisão do ADR-09 ele é serviço de produção e mora no arquivo base. Arquivo
# separado e não `profiles:` de propósito (spec D4) — o que o servidor não
# recebe fica visível no diff.
#
# Uso:
#   LOTUS_ENV_FILE=./docker/probe.env LOTUS_HTTP_PORT=8081 \
#     docker compose -f docker-compose.prod.yml -f docker-compose.prod-probe.yml up -d
services:
  app:
    # Só o acréscimo do minio: o mysql já vem do compose de produção com
    # service_healthy, e o merge de mapas do Compose soma este depends_on ao
    # de lá. minio é consumido sob demanda, em request, então service_started
    # basta.
    depends_on:
      minio: {condition: service_started}

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lotus
      MINIO_ROOT_PASSWORD: lotus-secret
    # 9002 no host para não brigar com o MinIO do compose de dev, que já ocupa
    # 9000/9001 nesta máquina.
    ports: ["9002:9000"]

  createbuckets:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 lotus lotus-secret) do echo waiting for minio; sleep 2; done;
      /usr/bin/mc mb -p local/lotus;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit
    ports: ["8026:8025"]
