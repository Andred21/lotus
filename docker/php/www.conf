[www]
; Teto de memória do SAPI **fpm**, separado do CLI de propósito (spec D5). O
; número é medido, e a regra do plano ganhou um PISO na execução, por decisão do
; João em 2026-08-22. A emenda e a medição que a sustenta estão logo abaixo: este
; comentário é o registro primário do número, não um ponteiro para outro arquivo.
;
; A regra original era "menor múltiplo de 64M acima do dobro do maior pico real".
; Ela foi escrita esperando picos na casa de 100M, como os do CLI. No FPM o
; opcache guarda o bytecode em memória compartilhada, FORA do heap do request:
; o mesmo boot do Laravel que consome 26,00 MB no CLI (medido bootando o kernel e
; tratando GET /up: `real_true=26.00MB`) consome 4,00 MB aqui. Aplicada a esses
; números, a regra crua devolvia 64M — ABAIXO do default 128M do PHP. Baixar o
; teto sob o default não compra nada e cria uma forma nova de o produto falhar.
;
; Picos medidos nesta execução, com resposta 200 confirmada, contra as rotas
; mais pesadas do produto:
;   manual .docx (OOXML em Blade), turma do seed .............  6,00 MB
;   manual .docx, MESMA turma com 72 alunos a mais ........... 11,09 MB
;   PDF do certificado (Gotenberg/Chromium) ..................  6,00 MB
;   importação OpenSpout de 800 linhas .......................  4,00 MB
;
; O manual é o único que ESCALA com o dado: 72 alunos a mais quase dobraram o
; pico. É por ele que o piso existe, e não pela média. 256M dá ~23x de folga
; sobre o pior caso medido e, com os cinco workers default do pool, soma 1,25 GB
; — cabe na t4g.small de 2 GB que o sizing ainda em aberto considera.
;
; php_admin_value (e não php_value) porque só ele impede que a aplicação suba o
; próprio teto em runtime: um ini_set() que vence o limite operacional é a
; forma de o processo estourar a memória da EC2 sem que ninguém tenha decidido.
php_admin_value[memory_limit] = 256M

; Fixado, e não herdado do default da imagem base: metade da aritmética acima
; (256M x 5 = 1,25 GB, que é o que cabe na t4g.small) mora neste número. Deixá-lo
; implícito faz um bump de tag da php:8.3-fpm-alpine mudar o teto de RAM da EC2
; sem tocar arquivo nenhum deste repositório — e a decisão de sizing que este
; bloco alimenta passaria a citar um número que não é mais verdade.
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
