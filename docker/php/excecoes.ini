; Stack trace sem o valor dos argumentos (item 34, revisão final; decisão do João,
; 2026-10-05). O log da aplicação sai do host para o CloudWatch por 30 dias
; (ADR-21), e com a diretiva desligada o trace grava cada argumento string com
; até 15 caracteres, o que cabe num RUT. O trace mantém arquivo, linha e função.
zend.exception_ignore_args = On
