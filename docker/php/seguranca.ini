; Defesa em profundidade contra o PHP2Shell (CVE-2026-109618 e CVE-2026-109619;
; hotfix de 2026-10-23). O caminho de abuso conhecido passa pelo upload progress
; da sessão nativa do PHP, e o Lotus não usa essa sessão: o Laravel tem driver
; próprio (`database`), então desligar custa nada. NÃO substitui o patch — a
; GMO Flatt Security mostrou no dia da divulgação que só isto não fecha a falha.
; Quem fecha é a base 8.3.36+ do Dockerfile.prod.
session.upload_progress.enabled = Off
