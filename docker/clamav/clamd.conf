# clamd do compose de produção. O adapter é App\Shared\Files\ClamAvScanner:
# INSTREAM em TCP, sem socket Unix, sem porta publicada no host.
#
# Este arquivo existe porque `clamav/clamav` NÃO publica imagem arm64 (medido em
# 2026-09-04: 1.4, 1.4_base, latest e stable só têm linux/amd64) e o host de
# produção é t4g/Graviton. A imagem passa a ser construída aqui, a partir do
# pacote `clamav-daemon` do Alpine — mesma linha 1.4 contra a qual o protocolo
# foi verificado em 2026-08-25.

# Sem LogFile: em foreground o clamd escreve no stdout, que é onde o
# json-file do Compose (com teto de 10m x 3) já sabe recolher.
Foreground yes
LogTime yes

DatabaseDirectory /var/lib/clamav
User clamav

TCPSocket 3310
# 0.0.0.0 e não 127.0.0.1: quem chama é o container `app`, pela rede interna do
# Compose. A porta não é publicada no host — o isolamento vem dali, não do bind.
TCPAddr 0.0.0.0

# O teto do upload é 10 MB (ContentClass). 25M dá folga para o enquadramento do
# INSTREAM sem deixar o daemon aceitar stream de tamanho arbitrário.
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M

# 2 threads: o host tem 2 vCPU e o scan é síncrono na validação de UM upload de
# ~10 usuários internos. Mais threads só multiplicariam o pico de memória.
MaxThreads 2

# NÃO recarregar a base em paralelo com a antiga. O default (yes) mantém as
# DUAS bases em memória durante o reload do freshclam, e a base carregada
# MEDIDA em 2026-09-04 é 1,113 GiB — o dobro disso não existe num t4g.small de
# 2 GiB. Com `no`, o clamd pausa os scans durante o reload em vez de duplicar a
# memória: numa aplicação de ~10 usuários internos, a pausa não é sentida e o
# OOM seria.
ConcurrentDatabaseReload no
