# Atualização da base de assinaturas. Roda DENTRO do container (freshclam -d),
# gravando no volume nomeado `clamav-data` — por isso a base sobrevive ao
# deploy: a imagem é trocada a cada SHA, o volume não.
#
# A base NÃO é assada na imagem de propósito: são ~167 MB (main.cvd 84,9M +
# daily.cld 82,2M, medidos em 2026-09-04) que o host puxaria de novo a CADA
# deploy, já que a tag é o SHA do commit. No volume, ela é baixada uma vez.
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net

# Sem LogFile pelo mesmo motivo do clamd: stdout.
LogTime yes

# 12 checagens por dia é o default do projeto ClamAV e o que a base publica
# comporta. NotifyClamd faz o daemon recarregar sem reiniciar o container.
Checks 12
NotifyClamd /etc/clamav/clamd.conf
