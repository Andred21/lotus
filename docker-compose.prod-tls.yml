# Overlay de TLS. Entra ao lado do compose de produção QUANDO o certificado
# existe (deploy.sh detecta /opt/lotus/nginx/tls.conf + /etc/letsencrypt).
# Só o nginx muda: ganha a 443 e a conf que redireciona a 80. Bind mounts
# aqui são de CONFIGURAÇÃO do host (cert, conf, webroot do challenge) —
# nunca de código; a catraca do working tree segue valendo no arquivo base.
services:
  nginx:
    ports:
      - "${LOTUS_HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/lotus/nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      # Webroot do challenge ACME. Bind mount de caminho do HOST, e não volume
      # nomeado, porque quem ESCREVE aqui é o certbot do host — um volume
      # nomeado vive dentro do Docker e o certbot não tem como alcançá-lo. Era
      # o Q-6 do review de 2026-09-20: a renovação estava documentada como
      # "o webroot do challenge é servido pelo tls.conf", e o webroot citado era
      # um volume nomeado montado `:ro`, sem caminho no host — nem o certbot
      # escrevia nele, nem o `renew --dry-run` que deveria pegar isso passava.
      # `:ro` continua certo: o container SERVE o challenge, não o produz.
      # O diretório precisa ser 755 no host — quem lê é o worker do nginx
      # (uid 101), não o master.
      - /opt/lotus/certbot:/var/www/certbot:ro
