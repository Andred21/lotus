name: CI

# Branch nao dispara: as worktrees sao locais e o par PR+push duplicaria
# execucao sem informacao nova. O que dispara e o que decide -- a proposta
# de entrar em main, e a entrada em main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Push em main NAO cancela push em main. `github.ref` vale `refs/heads/main`
  # para todos eles, entao o grupo e um so: um segundo push cancelaria o job
  # `image` do primeiro no meio da publicacao e deixaria o SHA anterior com
  # meio par no GHCR. Em `pull_request` o cancelamento continua valendo -- la
  # o run antigo so gasta minuto, nao publica nada.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, gd, zip, intl, bcmath, pdo_sqlite, sqlite3
          coverage: none

      - name: Cache do composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Instala dependencias
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepara o ambiente de teste
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml ja fixa DB_CONNECTION=sqlite e DB_DATABASE=:memory:
      # (linhas 26-27), entao nenhum servico de banco sobe aqui.
      - name: Suite backend
        working-directory: backend
        run: php artisan test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Le a versao do campo packageManager de frontend/package.json --
      # a mesma fonte que o estagio spa da imagem de producao usa.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instala com o lockfile congelado
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Testes
        working-directory: frontend
        run: pnpm test

      - name: Build
        working-directory: frontend
        run: pnpm build

  types-drift:
    name: types-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, gd, zip, intl, bcmath, pdo_sqlite, sqlite3
          coverage: none

      - name: Cache do composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Instala dependencias
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepara o ambiente
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      # O transformer e INCREMENTAL: ele guarda o hash do arquivo de saida em
      # typescript-transformer-manifest.json e nao reescreve nada quando as
      # classes PHP nao mudaram. Medido em 2026-08-24 (run 32797276027): uma
      # linha acrescentada a mao ao generated.ts sobreviveu ao comando e o gate
      # passou verde. Apagar o par forca a regeneracao do zero, que e a unica
      # forma de o diff enxergar edicao manual -- que e o que a lei 5.3 proibe.
      - name: Apaga o alvo para forcar regeneracao do zero
        run: |
          rm -f frontend/src/shared/types/generated.ts \
                frontend/src/shared/types/typescript-transformer-manifest.json

      # Medido 2026-08-24: o comando boota o Laravel mas nao toca o banco --
      # sqlite :memory: basta e nenhum servico MySQL sobe. O diretorio de
      # saida sai de FrontendPath, que aqui resolve o irmao <workspace>/frontend
      # (no container do compose resolveria /frontend).
      - name: Regenera os tipos a partir dos DTOs
        working-directory: backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan typescript:transform

      # O comando acima imprime avisos sobre Spatie\LaravelData\Optional e
      # AINDA ASSIM sai 0 -- medido. Por isso quem julga e o diff, nunca o
      # texto da saida. O ::error com `file=` faz o GitHub nomear o arquivo
      # na interface, que e literalmente o que a ficha da D-08 exige.
      - name: Lei 5.3 - generated.ts nao se edita a mao
        run: |
          if ! git diff --exit-code -- frontend/src/shared/types/; then
            echo "::error file=frontend/src/shared/types/generated.ts::generated.ts diverge do que typescript:transform produz. Corrija o DTO no backend e regenere; nao edite o arquivo."
            exit 1
          fi

  # Reprova SO o que a imagem de producao carrega. --locked le o composer.lock
  # sem instalar vendor, e `pnpm audit` le o pnpm-lock.yaml sem node_modules --
  # entao este job nao precisa de nenhuma instalacao.
  audit-prod:
    name: audit-prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Advisories nas dependencias PHP de producao
        working-directory: backend
        run: composer audit --no-dev --locked

      - name: Advisories nas dependencias JS de producao
        working-directory: frontend
        run: pnpm audit --prod

  # REPROVA, desde 2026-08-29 (item 20). Ate entao este job rodava em
  # `continue-on-error: true` -- "reporta e nao reprova", decisao do item 11
  # para que uma advisory transitiva de ferramenta nao travasse a fila sem uma
  # linha de codigo ter mudado. O efeito medido foi o oposto do pretendido: o
  # job aparecia vermelho em TODO run, sem decidir nada, e vermelho deixou de
  # significar alguma coisa. Decisao do Joao: advisory em qualquer arvore
  # reprova, e este job entra no `needs` do `image`. O risco que a decisao
  # anterior evitava fica assumido -- a fila trava ate o bump do lockfile, que
  # e a saida certa (`pnpm update <pacote>`; ver CONTRIBUINDO.md, "Como ler o
  # CI"). Desligar o check nunca e.
  audit-dev:
    name: audit-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Advisories em toda a arvore PHP
        working-directory: backend
        run: composer audit --locked

      - name: Advisories em toda a arvore JS
        working-directory: frontend
        run: pnpm audit

  # A regua que o plano pago daria, reconstruida no unico lugar que sobra: o
  # artefato. `Gatika-CL` esta no plano free e branch protection em repositorio
  # privado exige plano pago (403 medido em 2026-08-25), entao NADA impede um
  # push direto em main. O que da para impedir e que esse push vire release --
  # este job entra no `needs` do `image`.
  #
  # Duas procedencias sao aceitas, e nenhuma outra:
  #   - commit que chegou por Pull Request MESCLADO (o fluxo do repo pessoal);
  #   - commit de espelho, que carrega o trailer `Source-Commit:`, tem a arvore
  #     limpa de todo path de `.espelho-exclusoes` E cujo trailer aponta para
  #     um commit que esta mesmo no historico de main da origem.
  #
  # O segundo caminho nao serve de atalho no pessoal: la `docs/` e `.claude/`
  # existem, entao a checagem de arvore limpa reprova e a exigencia de PR volta
  # a valer. A regra se auto-restringe, sem nome de repositorio no meio.
  #
  # A conferencia do trailer existe porque no CORPORATIVO a arvore limpa e o
  # normal, nao uma propriedade especial: sem ela, bastava uma linha de trailer
  # inventada num push direto para o commit se passar por release de espelho --
  # e esta e a unica camada entre esse push e uma imagem publicada. Quem
  # responde qual e a origem e a variavel de repositorio ESPELHO_FONTE
  # (`owner/nome`), nao uma constante aqui: o arquivo continua sem nome de dono,
  # e onde a variavel nao existe o caminho de espelho simplesmente nao abre.
  procedencia:
    name: procedencia
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      # `forced` vem do payload do push. Reescrita de historico em main e
      # exatamente o que `allow_force_pushes: false` recusaria no plano pago;
      # aqui ela nao e impedida, mas fica vermelha e datada no historico de
      # runs -- que e o que uma auditoria pede depois.
      - name: Force-push nao passa despercebido
        if: github.event.forced
        run: |
          echo "::error::force-push detectado em ${{ github.ref }}. main foi reescrita."
          exit 1

      - name: Procedencia do commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          FONTE: ${{ vars.ESPELHO_FONTE }}
        run: |
          trailer=$(git log -1 --pretty='%(trailers:key=Source-Commit,valueonly)' | tr -d '[:space:]')

          sujos=""
          while IFS= read -r caminho; do
            case "$caminho" in ''|\#*) continue ;; esac
            [ -e "$caminho" ] && sujos="$sujos $caminho"
          done < .espelho-exclusoes

          if [ -n "$trailer" ]; then
            if [ -n "$sujos" ]; then
              echo "::error::commit de espelho, mas a arvore carrega arquivo de desenvolvimento:$sujos"
              exit 1
            fi

            if [ -z "$FONTE" ]; then
              echo "::error::o commit traz Source-Commit, mas a variavel de repositorio ESPELHO_FONTE nao esta definida. Sem ela nao ha contra o que conferir a origem, e um trailer inventado passaria. Defina ESPELHO_FONTE como o repositorio de origem (owner/nome)."
              exit 1
            fi

            if [ ${#trailer} -ne 40 ] || [ -n "$(printf '%s' "$trailer" | tr -d '0-9a-f')" ]; then
              echo "::error::Source-Commit '$trailer' nao e um SHA de 40 hexadecimais."
              exit 1
            fi

            # base=main, head=$trailer. `identical` = o trailer E a ponta de
            # main na origem; `behind` = ele e ancestral dela. Qualquer outra
            # coisa -- `ahead`, `diverged` ou erro de API -- significa commit
            # que nunca entrou em main la, inclusive o SHA inventado, que a API
            # responde com 404 e cai no mesmo ramo.
            # `|| situacao=""` e nao `|| true`: em erro o gh escreve o corpo do
            # 404 na saida padrao, e sem isso o JSON inteiro viraria o valor de
            # $situacao e vazaria para a mensagem de erro.
            situacao=$(gh api "repos/$FONTE/compare/main...$trailer" --jq .status 2>/dev/null) || situacao=""
            case "$situacao" in
              identical|behind)
                echo "release de espelho. Fonte: $FONTE@$trailer ($situacao em relacao a main de $FONTE)."
                exit 0
                ;;
              *)
                echo "::error::Source-Commit $trailer nao esta no historico de main em $FONTE (situacao: ${situacao:-inacessivel}). O trailer nao comprova procedencia; nenhuma imagem sera publicada."
                exit 1
                ;;
            esac
          fi

          mesclados=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null)] | length')
          if [ "$mesclados" -ge 1 ]; then
            echo "commit entrou por Pull Request mesclado."
            exit 0
          fi

          echo "::error::$SHA entrou em main sem Pull Request mesclado e sem trailer de espelho. Nenhuma imagem sera publicada para ele."
          exit 1

  image:
    name: image
    # Nenhum gate vermelho passa daqui: e isto que faz o DoD
    # "commit reprovado nao gera release promovivel" ser mecanico e nao
    # combinado. audit-dev entra desde 2026-08-29 -- antes reportava sem
    # decidir, e um run vermelho com par publicado era exatamente a
    # incoerencia que este `needs` existe para impedir. procedencia entra
    # porque, sem branch protection, ele e a unica coisa entre um push direto
    # em main e um artefato publicado.
    needs: [backend, frontend, types-drift, audit-prod, audit-dev, procedencia]
    # Sem nome de dono na condicao. Branch e PR rodam so os gates; o custo
    # do bloco esta neste job, e e daqui que vem o "CI rapido".
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # github.repository vem com maiuscula. GHCR recusa nome com maiuscula
      # ("repository name must be lowercase"), entao usar a variavel crua no
      # `tags:` falha o push.
      - name: Nome do repositorio em minusculas
        id: repo
        run: echo "lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # QEMU para o build arm64: o host de producao e t4g (Graviton). O par
      # passa a ser manifest list amd64+arm64 -- o preco e build ~2x mais
      # lento, aceito na spec v2 do item 10 (D5).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag de um SHA se escreve UMA vez. Um `gh run rerun` meses depois
      # reconstroi o mesmo fonte, mas o Dockerfile so fixa as imagens base por
      # digest -- o indice do apk e o do Alpine nao se fixam --, entao o
      # resultado nao e byte identico, e sobrescrever a tag trocaria em silencio
      # o artefato que o item 12 talvez ja tenha promovido. Republicar so quando
      # falta metade do par: o rastro de uma publicacao interrompida no meio.
      - name: O conjunto ja existe para este SHA?
        id: par
        env:
          APP: ghcr.io/${{ steps.repo.outputs.lc }}-app:${{ github.sha }}
          WEB: ghcr.io/${{ steps.repo.outputs.lc }}-web:${{ github.sha }}
          CLAM: ghcr.io/${{ steps.repo.outputs.lc }}-clamav:${{ github.sha }}
        run: |
          if docker buildx imagetools inspect "$APP" >/dev/null 2>&1 \
             && docker buildx imagetools inspect "$WEB" >/dev/null 2>&1 \
             && docker buildx imagetools inspect "$CLAM" >/dev/null 2>&1; then
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            echo "o conjunto de $GITHUB_SHA ja esta no GHCR. Nada a reconstruir."
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

      # Os dois alvos sao construidos ANTES de qualquer push. Falha de build e
      # o modo de falha comum; construir primeiro faz ela acontecer com zero
      # imagem publicada, em vez de acontecer entre o push do app e o do web e
      # deixar o SHA com meio par no GHCR -- o "release e o par" do DoD3 depende
      # de nao existir SHA pela metade. `scope` separado por alvo porque um
      # cache gha unico e sobrescrito pelo segundo build.
      - name: Constroi o alvo app
        if: steps.par.outputs.publicar == 'true'
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: docker/Dockerfile.prod
          target: app
          push: false
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Constroi o alvo web
        if: steps.par.outputs.publicar == 'true'
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: docker/Dockerfile.prod
          target: web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # O antivirus entra no conjunto desde 2026-09-04: `clamav/clamav` publica
      # SO linux/amd64 (medido em 1.4, 1.4_base, latest e stable) e o host de
      # producao e t4g/Graviton -- o `compose pull` do deploy morria em "no
      # matching manifest for linux/arm64/v8". A imagem passa a sair daqui, do
      # pacote clamav-daemon do Alpine, na mesma linha 1.4 contra a qual o
      # protocolo INSTREAM foi verificado.
      - name: Constroi o alvo clamav
        if: steps.par.outputs.publicar == 'true'
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: docker/Dockerfile.prod
          target: clamav
          push: false
          cache-from: type=gha,scope=clamav
          cache-to: type=gha,mode=max,scope=clamav

      # SHA completo e sem `latest`, de proposito: tag movel convida
      # `docker pull latest` no servidor, que e o habito que o item 12
      # existe para substituir. Estes dois passos saem do cache dos anteriores,
      # entao o que sobra aqui e o upload.
      - name: Publica o alvo app
        if: steps.par.outputs.publicar == 'true'
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: docker/Dockerfile.prod
          target: app
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.lc }}-app:${{ github.sha }}
          cache-from: type=gha,scope=app

      - name: Publica o alvo web
        if: steps.par.outputs.publicar == 'true'
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: docker/Dockerfile.prod
          target: web
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.lc }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web

      - name: Publica o alvo clamav
        if: steps.par.outputs.publicar == 'true'
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: docker/Dockerfile.prod
          target: clamav
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.lc }}-clamav:${{ github.sha }}
          cache-from: type=gha,scope=clamav

      # O DoD3 diz "release e o par" -- desde 2026-09-04 o par virou trio, com
      # o antivirus. Isto o afirma no fim do job, em vez de confiar que tres
      # passos verdes bastam: se o job termina verde, os tres manifestos
      # existem no GHCR para este SHA.
      - name: O conjunto existe no GHCR
        env:
          APP: ghcr.io/${{ steps.repo.outputs.lc }}-app:${{ github.sha }}
          WEB: ghcr.io/${{ steps.repo.outputs.lc }}-web:${{ github.sha }}
          CLAM: ghcr.io/${{ steps.repo.outputs.lc }}-clamav:${{ github.sha }}
        run: |
          docker buildx imagetools inspect "$APP" >/dev/null
          docker buildx imagetools inspect "$WEB" >/dev/null
          docker buildx imagetools inspect "$CLAM" >/dev/null
          echo "conjunto publicado para $GITHUB_SHA: $APP, $WEB e $CLAM"
